<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#E8452C" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="火锅配送" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>火锅配送 · 每日送货单</title>
<style>
  :root{
    --red:#E8452C;
    --red-soft:#FFF0EB;
    --green:#1CA66A;
    --green-soft:#E9F8F1;
    --amber:#E9962B;
    --amber-soft:#FFF6E5;
    --ink:#241C17;
    --ink-2:#6B6058;
    --ink-3:#A29890;
    --line:#EDE6E0;
    --bg:#F6F1EC;
    --card:#FFFFFF;
    --radius:18px;
    --shadow:0 2px 8px rgba(60,38,25,.05), 0 8px 24px rgba(60,38,25,.05);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:#E9E1D9;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 9:16 竖屏机身 ---------- */
  .phone{
    position:relative;
    height:min(96vh,900px);
    aspect-ratio:9/16;
    background:var(--bg);
    border-radius:38px;
    box-shadow:0 30px 70px rgba(53,33,20,.28), 0 0 0 10px #17120F, 0 0 0 11px #2C2420;
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
  @media (max-width:600px), (max-height:620px){
    body{background:var(--bg)}
    .phone{height:100dvh;width:100vw;aspect-ratio:auto;border-radius:0;box-shadow:none}
  }

  /* ---------- 顶部 ---------- */
  .topbar{flex:0 0 auto;padding:14px 18px 10px;background:linear-gradient(180deg,#FFF7F2 0%,rgba(255,247,242,0) 100%)}
  .brand{display:flex;align-items:center;gap:8px}
  .brand-mark{
    width:30px;height:30px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(150deg,#FF6A45,#D9331A);
    display:grid;place-items:center;box-shadow:0 4px 10px rgba(217,51,26,.28);
  }
  .brand-mark svg{width:17px;height:17px;display:block}
  .brand-title{font-size:17px;font-weight:700;letter-spacing:.2px}
  .brand-sub{font-size:11px;color:var(--ink-3);margin-left:auto;font-weight:500}
  .daterow{display:flex;align-items:center;gap:10px;margin-top:12px}
  .date-btn{
    flex:1 1 auto;display:flex;align-items:center;gap:9px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:9px 12px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .15s ease;position:relative;overflow:hidden;
  }
  .date-btn:active{transform:scale(.985)}
  .date-btn .cal{width:17px;height:17px;flex:0 0 auto;color:var(--red)}
  .date-main{font-size:14.5px;font-weight:650;line-height:1.15}
  .date-tag{font-size:10.5px;font-weight:600;color:var(--red);background:var(--red-soft);padding:2px 6px;border-radius:6px;margin-left:2px}
  .date-week{font-size:11.5px;color:var(--ink-3);margin-left:auto}
  .date-btn input[type=date]{position:absolute;inset:0;opacity:0;border:0;padding:0;width:100%;height:100%;cursor:pointer}
  .today-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-2);font-size:12.5px;font-weight:600;padding:10px 13px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
  .today-btn:active{transform:scale(.97)}

  /* ---------- 内容区 ---------- */
  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:2px 18px 108px;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{width:0}

  .overview{
    background:linear-gradient(145deg,#FF6F4A 0%,#E03A22 58%,#C33019 100%);
    border-radius:20px;padding:15px 16px 14px;color:#fff;
    box-shadow:0 8px 22px rgba(200,60,35,.24);margin-top:2px;position:relative;overflow:hidden;
  }
  .overview::after{content:"";position:absolute;right:-38px;top:-46px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.10)}
  .ov-head{display:flex;align-items:baseline;gap:6px;position:relative;z-index:1}
  .ov-num{font-size:26px;font-weight:800;line-height:1;letter-spacing:-.5px}
  .ov-num small{font-size:13px;font-weight:600;opacity:.85;margin-left:1px}
  .ov-label{font-size:12.5px;opacity:.9;font-weight:500}
  .ov-right{margin-left:auto;text-align:right;font-size:11.5px;opacity:.9;line-height:1.5}
  .ov-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.24);margin-top:12px;overflow:hidden;position:relative;z-index:1}
  .ov-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFE0A3,#FFD08A);transition:width .45s cubic-bezier(.3,.9,.3,1)}
  .ov-foot{display:flex;gap:18px;margin-top:9px;font-size:11.5px;opacity:.92;position:relative;z-index:1}
  .ov-foot b{font-weight:700;font-size:12.5px;margin-right:3px}

  .sec-head{display:flex;align-items:center;gap:8px;margin:20px 2px 10px}
  .sec-title{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.3px}
  .sec-count{font-size:11px;color:var(--ink-3);font-weight:600}
  .sec-line{flex:1;height:1px;background:var(--line)}
  .mini-btn{
    flex:0 0 auto;border:0;font-family:inherit;font-size:11px;font-weight:700;
    color:var(--red);background:var(--red-soft);padding:6px 10px;border-radius:9px;cursor:pointer;
  }
  .mini-btn.solid{color:#fff;background:var(--red);width:26px;height:26px;padding:0;border-radius:9px;font-size:15px;line-height:1}
  .mini-btn:active{opacity:.8}

  .card{
    background:var(--card);border-radius:var(--radius);padding:13px 14px;
    box-shadow:var(--shadow);border:1px solid rgba(237,230,224,.7);
    margin-bottom:10px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .15s ease;animation:up .32s cubic-bezier(.25,.9,.3,1) both;
  }
  .card:active{transform:scale(.99)}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card-row{display:flex;align-items:center;gap:10px}
  .avatar{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:15px;font-weight:800;background:var(--red-soft);color:var(--red)}
  .card.done .avatar{background:var(--green-soft);color:var(--green)}
  .card-name{font-size:15px;font-weight:650;line-height:1.25}
  .card-meta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;align-items:center;gap:5px}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3);display:inline-block;opacity:.7}
  .chip{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  .chip.done{background:var(--green-soft);color:var(--green)}
  .chip.doing{background:var(--amber-soft);color:var(--amber)}
  .chip.none{background:#F2EFEC;color:var(--ink-3)}
  .chip svg{width:10px;height:10px}
  .card-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .chev{width:16px;height:16px;color:#CFC7C0}
  .bar{height:5px;border-radius:99px;background:#F3EFEB;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF8A63,#E8452C);transition:width .45s ease}
  .card.done .bar i,.bar.done i{background:linear-gradient(90deg,#4BD08B,#1CA66A)}
  .todo-line{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .todo-line span{font-size:10.5px;font-weight:600;color:var(--ink-2);background:#F7F3EF;border-radius:6px;padding:3px 7px}
  .todo-line .more{background:none;color:var(--ink-3);padding-left:1px}

  .empty{text-align:center;padding:42px 20px;color:var(--ink-3);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px dashed #E4DCD5}
  .empty svg{width:44px;height:44px;margin-bottom:12px;color:#D9D0C8}
  .empty p{margin:0 0 5px;font-size:14px;font-weight:650;color:var(--ink-2)}
  .empty span{font-size:12px}
  .empty-actions{display:flex;gap:8px;justify-content:center;margin-top:14px}
  .empty-actions button{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-family:inherit;font-size:12px;font-weight:650;padding:9px 14px;border-radius:11px;cursor:pointer}
  .store-tip{font-size:11px;color:var(--ink-3);line-height:1.65;margin:-2px 2px 12px}
  .check-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;margin:2px 0 14px;cursor:pointer}
  .check-line input{width:17px;height:17px;accent-color:var(--red);margin:0}

  /* ---------- 底部导航 ---------- */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:calc(74px + env(safe-area-inset-bottom));z-index:20;
    display:flex;align-items:center;justify-content:space-around;
    background:linear-gradient(180deg,rgba(246,241,236,0) 0%,#FBF7F4 32%);
    padding:0 14px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:10.5px;font-weight:600;cursor:pointer;border:0;background:none;padding:6px 12px;font-family:inherit}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--red)}
  .fab{
    position:absolute;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:21;
    width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;
    background:linear-gradient(150deg,#FF6A45,#D9331A);color:#fff;
    display:grid;place-items:center;box-shadow:0 8px 20px rgba(217,51,26,.36);
    transition:transform .16s;
  }
  .fab:active{transform:scale(.93)}
  .fab svg{width:24px;height:24px}

  /* ---------- 详情页 ---------- */
  .detail-top{flex:0 0 auto;padding:14px 18px 10px;background:linear-gradient(180deg,#FFF7F2,rgba(255,247,242,0));display:flex;align-items:center;gap:10px}
  .back{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);flex:0 0 auto;color:var(--ink-2)}
  .back svg{width:17px;height:17px}
  .detail-title{font-size:16px;font-weight:700;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .detail-sub{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:2px}

  .banner{display:flex;align-items:center;gap:9px;background:var(--green-soft);border:1px solid #C9EEDB;color:#158057;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:12.5px;font-weight:650;animation:up .3s ease both}
  .banner svg{width:18px;height:18px;flex:0 0 auto}
  .banner small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:2px}

  .goods{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(237,230,224,.7)}
  .g-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #F5F0EB;cursor:pointer;transition:background .15s;animation:up .28s ease both}
  .g-row:last-child{border-bottom:0}
  .g-row:active{background:#FBFAF8}
  .g-check{width:26px;height:26px;border-radius:9px;flex:0 0 auto;border:2px solid #E2DAD3;display:grid;place-items:center;transition:all .18s cubic-bezier(.3,.9,.3,1)}
  .g-check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.5);transition:all .18s}
  .g-row.done .g-check{background:var(--green);border-color:var(--green);box-shadow:0 3px 8px rgba(28,166,106,.24)}
  .g-row.done .g-check svg{opacity:1;transform:scale(1)}
  .g-body{flex:1;min-width:0}
  .g-name{font-size:14.5px;font-weight:600;transition:.2s;line-height:1.3}
  .g-row.done .g-name{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
  .g-remark{font-size:11px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-row.done .g-remark{opacity:.6}
  .g-qty{font-size:12px;color:var(--ink-2);font-weight:600;background:#F6F2EE;border-radius:8px;padding:4px 8px;white-space:nowrap}
  .g-row.done .g-qty{opacity:.55}
  .g-edit{width:28px;height:28px;border-radius:8px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:#C7BFB8;flex:0 0 auto}
  .g-edit svg{width:15px;height:15px}
  .g-edit:active{background:#F5F1ED}

  .detail-foot{padding:10px 18px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,241,236,0),#FBF7F4 40%);display:flex;gap:10px}
  .btn{border:0;border-radius:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s, opacity .15s;padding:13px 16px}
  .btn:active{transform:scale(.98)}
  .btn-primary{flex:1;background:linear-gradient(150deg,#FF6A45,#D9331A);color:#fff;box-shadow:0 8px 18px rgba(217,51,26,.28)}
  .btn-ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow);flex:0 0 auto}
  .btn:disabled{opacity:.42;box-shadow:none;cursor:default}

  /* ---------- 采购清单 ---------- */
  .sum-card{
    background:var(--card);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow);
    border:1px solid rgba(237,230,224,.7);margin-top:2px;
  }
  .sum-top{display:flex;align-items:flex-end;gap:6px}
  .sum-money{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1}
  .sum-money small{font-size:14px;font-weight:700;margin-right:1px}
  .sum-cap{font-size:11.5px;color:var(--ink-3);font-weight:600;margin-left:2px;padding-bottom:2px}
  .sum-right{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink-2);line-height:1.55}
  .sum-right b{color:var(--green);font-weight:700}
  .sum-foot{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11px;color:var(--ink-3)}
  .sum-foot .pbar{flex:1;height:5px;border-radius:99px;background:#F3EFEB;overflow:hidden}
  .sum-foot .pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4BD08B,#1CA66A);transition:width .4s ease}

  .p-list{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid rgba(237,230,224,.7)}
  .p-row{display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid #F5F0EB;cursor:pointer;animation:up .28s ease both}
  .p-row:last-child{border-bottom:0}
  .p-row:active{background:#FBFAF8}
  .p-row .g-check{width:24px;height:24px;border-radius:8px}
  .p-row.done .g-check{background:var(--green);border-color:var(--green)}
  .p-row.done .g-check svg{opacity:1;transform:scale(1)}
  .p-main{flex:1;min-width:0}
  .p-name{font-size:14px;font-weight:650;line-height:1.3}
  .p-row.done .p-name{color:var(--ink-3);text-decoration:line-through}
  .p-meta{font-size:10.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-amt{text-align:right;flex:0 0 auto;margin-left:2px}
  .p-amt b{display:block;font-size:14px;font-weight:750;letter-spacing:-.2px}
  .p-row.done .p-amt b{color:var(--ink-3)}
  .p-amt span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:1px}

  /* ---------- 历史 ---------- */
  .h-card{background:var(--card);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid rgba(237,230,224,.7);cursor:pointer;animation:up .3s ease both}
  .h-card:active{transform:scale(.99)}
  .h-date{font-size:14.5px;font-weight:700}
  .h-week{font-size:11px;color:var(--ink-3);margin-left:6px;font-weight:500}
  .h-stats{display:flex;gap:12px;font-size:11.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
  .h-stats b{font-size:12.5px;font-weight:700;color:var(--ink)}
  .h-stats .g{color:var(--green)}
  .h-empty{font-size:12px;color:var(--ink-3);text-align:center;padding:34px 12px;line-height:1.9}

  .backup{margin-top:24px}
  .backup-title{font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:9px;letter-spacing:.2px}
  .backup-row{display:flex;gap:8px}
  .backup-row button{
    flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    font-family:inherit;font-size:12px;font-weight:650;padding:11px 6px;border-radius:12px;
    cursor:pointer;box-shadow:var(--shadow);
  }
  .backup-row button:active{transform:scale(.98)}
  .backup-tip{font-size:10.5px;color:var(--ink-3);line-height:1.7;margin-top:9px}
  .clear-btn{display:block;margin:20px auto 0;background:none;border:0;font-family:inherit;color:#B9AFA7;font-size:11.5px;font-weight:600;cursor:pointer;padding:8px}

  /* ---------- 弹层 ---------- */
  .mask{position:absolute;inset:0;background:rgba(36,28,23,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(2px)}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:24px 24px 0 0;
    padding:8px 18px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
    max-height:86%;overflow-y:auto;
  }
  .sheet.show{transform:translateY(0)}
  .grab{width:38px;height:4px;border-radius:99px;background:#E5DED8;margin:0 auto 14px}
  .sheet h3{margin:0 0 14px;font-size:16.5px;font-weight:700}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px;letter-spacing:.2px}
  .input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;font-size:15px;font-family:inherit;color:var(--ink);background:#FBFAF8;outline:none;transition:border-color .18s, background .18s}
  .input:focus{border-color:#FFB4A0;background:#fff}
  textarea.input{resize:none;line-height:1.65;font-size:13.5px}
  .row-2{display:flex;gap:10px}
  .row-2 .field:first-child{flex:1}
  .row-2 .field:last-child{flex:0 0 108px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .pick{border:1.5px solid var(--line);background:#FBFAF8;color:var(--ink-2);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:99px;cursor:pointer;transition:.15s}
  .pick.on{background:var(--red-soft);border-color:#FFB4A0;color:var(--red)}
  .sheet-actions{display:flex;gap:10px;margin-top:16px}
  .sheet-actions .btn{width:100%}
  .danger{color:#D6331B;background:var(--red-soft);border:0;box-shadow:none;width:100%}
  .hint{font-size:10.5px;color:var(--ink-3);margin:-6px 0 12px;line-height:1.65}
  .link-btn{background:none;border:0;font-family:inherit;color:var(--red);font-size:11.5px;font-weight:650;cursor:pointer;padding:0}
  .preview{
    background:#FBF8F5;border:1px solid var(--line);border-radius:13px;padding:11px 12px;
    font-size:11.5px;color:var(--ink-2);line-height:1.75;max-height:170px;overflow-y:auto;
  }
  .preview b{color:var(--ink);font-weight:700}
  .preview .pv-store{margin-top:6px}
  .preview .pv-store b{margin-right:5px}
  .preview .pv-store:first-child{margin-top:0}
  .preview .pv-items{color:var(--ink-3);font-size:11px}
  .preview .pv-empty{color:#B9AFA7}
  .pv-tag{display:inline-block;font-size:9.5px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:5px;padding:1px 5px;margin-right:4px;vertical-align:1px}

  /* toast */
  .toast{
    position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);
    background:rgba(36,28,23,.9);color:#fff;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;
    transition:all .25s ease;white-space:nowrap;max-width:84%;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="phone">
  <div class="app">
    <div id="topbar"></div>
    <div class="scroll" id="scroll"></div>
    <button class="fab" id="fab" aria-label="添加门店">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="tabbar" id="tabbar">
      <button class="tab" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V20h14V9.8"/><path d="M9.5 20v-5.5h5V20"/></svg>
        <span>今日配送</span>
      </button>
      <button class="tab" data-tab="purchase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2.2 10.5h9.4L20 7.5H6"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
        <span>采购清单</span>
      </button>
      <button class="tab" data-tab="stores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5V20h16V9.5"/><path d="M3 9.5 5.5 4h13L21 9.5"/><path d="M3 9.5h18"/><path d="M9.5 20v-5.5h5V20"/></svg>
        <span>常用门店</span>
      </button>
      <button class="tab" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4.5l3 1.8"/></svg>
        <span>历史记录</span>
      </button>
    </div>
    <div class="mask" id="mask"></div>
    <div class="sheet" id="sheet"></div>
    <div class="toast" id="toast"></div>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const KEY = 'hotpot_delivery_v2';
const KEY_BAK = 'hotpot_delivery_v2_bak';
const OLD_KEY = 'hotpot_delivery_v1';
const PRESET_GOODS = ['毛肚','鸭肠','黄喉','牛肉卷','羊肉卷','虾滑','午餐肉','豆皮','土豆','藕片','金针菇','宽粉','鸭血','鱼丸','青菜','千层肚'];
const UNITS = ['份','斤','箱','袋','个','包','瓶','盒','公斤','克','件','只','条','桶','把','根','块','片','罐'];
const UNIT_SET = new Set(UNITS);
const PRICE = {毛肚:35,鸭肠:28,黄喉:48,牛肉卷:42,羊肉卷:40,虾滑:30,午餐肉:120,豆皮:9,土豆:5,藕片:8,金针菇:6,宽粉:12,鸭血:7,鱼丸:15,青菜:4,千层肚:32};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = n => '¥' + (Math.round((n || 0) * 100) / 100).toFixed(2);
const num = n => { const v = Math.round((n || 0) * 100) / 100; return String(v); };

function todayKey(d = new Date()){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function shiftKey(key, delta){
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return todayKey(dt);
}
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
function parseKey(key){
  const [y, m, d] = key.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return { y, m, d, week: WEEK[dt.getDay()] };
}
function fmtLong(key){ const { m, d, week } = parseKey(key); return `${m}月${d}日 · ${week}`; }
function dayLabel(key){
  if (key === todayKey()) return '今天';
  if (key === shiftKey(todayKey(), -1)) return '昨天';
  return '';
}

function normalize(db){
  if (!db || typeof db !== 'object') db = { days: {} };
  db.days = db.days || {};
  db.stores = Array.isArray(db.stores) ? db.stores : [];
  Object.keys(db.days).forEach(k => {
    const day = db.days[k] || {};
    day.restaurants = Array.isArray(day.restaurants) ? day.restaurants : [];
    day.purchase = Array.isArray(day.purchase) ? day.purchase : [];
    day.restaurants.forEach(r => {
      r.goods = Array.isArray(r.goods) ? r.goods : [];
      r.goods.forEach(g => { if (typeof g.remark !== 'string') g.remark = ''; });
    });
    day.purchase.forEach(p => {
      if (typeof p.remark !== 'string') p.remark = '';
      if (typeof p.price !== 'number') p.price = Number(p.price) || 0;
    });
    db.days[k] = day;
  });
  return db;
}

/* 演示数据 */
function seedDay(){
  const mk = (name, items) => ({
    id: uid(), name, deliveredAt: null,
    goods: items.map(([n, q, u, remark, done]) => ({ id: uid(), name: n, qty: q, unit: u, remark: remark || '', done: !!done }))
  });
  return {
    restaurants: [
      mk('川味老火锅', [['毛肚', 5, '份', '冰鲜，切大片', true], ['鸭肠', 3, '份', '去油', true], ['黄喉', 2, '斤', '', true], ['土豆', 4, '份', '切片', true]]),
      mk('牛油记', [['牛肉卷', 6, '份', '肥牛，卷装', true], ['虾滑', 2, '份', '', true], ['豆皮', 3, '斤', '干的', false], ['金针菇', 4, '份', '', false], ['宽粉', 2, '袋', '', false]]),
      mk('蜀九香', [['羊肉卷', 5, '份', '', false], ['午餐肉', 2, '箱', '梅林', false], ['藕片', 3, '份', '脆藕', false], ['鸭血', 2, '份', '', false]])
    ],
    purchase: []
  };
}

function loadDb(){
  let raw = null;
  try {
    raw = localStorage.getItem(KEY) || localStorage.getItem(KEY_BAK) || localStorage.getItem(OLD_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { /* 数据损坏则重建 */ }
  const db = normalize({ days: {} });
  const t = todayKey();
  db.days[t] = seedDay();
  db.days[t].purchase = aggregateOf(db.days[t]);
  const hist = [
    [1, [['川味老火锅', 4, 4], ['牛油记', 5, 5], ['蜀九香', 3, 2]]],
    [2, [['川味老火锅', 4, 4], ['牛油记', 5, 5]]],
    [3, [['蜀九香', 4, 4], ['毛肚张', 3, 3]]]
  ];
  hist.forEach(([back, shops]) => {
    const k = shiftKey(t, -back);
    const day = { restaurants: [], purchase: [] };
    day.restaurants = shops.map(([name, total, done]) => ({
      id: uid(), name, deliveredAt: done === total ? k : null,
      goods: Array.from({ length: total }, (_, i) => ({
        id: uid(),
        name: PRESET_GOODS[(i + name.length) % PRESET_GOODS.length],
        qty: (i % 3) + 1,
        unit: ['份', '斤', '袋'][i % 3],
        remark: '',
        done: i < done
      }))
    }));
    day.purchase = aggregateOf(day);
    db.days[k] = day;
  });
  /* 常用门店：默认收录演示里的门店 */
  db.stores = [...new Set(Object.values(db.days).flatMap(d => d.restaurants.map(r => r.name)))]
    .map(n => ({ id: uid(), name: n, createdAt: todayKey() }));
  return db;
}

let db = loadDb();
let currentDate = todayKey();
let route = { name: 'home' };

function save(){
  try {
    const s = JSON.stringify(db);
    localStorage.setItem(KEY, s);
    localStorage.setItem(KEY_BAK, s);   /* 双写，降低单条损坏导致全盘丢失的风险 */
  } catch (e) { toast('存储空间不足，请先导出备份'); }
}
function getDay(key = currentDate, create = true){
  if (!db.days[key] && create) db.days[key] = { restaurants: [], purchase: [] };
  return db.days[key];
}
function dayStats(day){
  let total = 0, done = 0, shopsDone = 0;
  (day?.restaurants || []).forEach(r => {
    const t = r.goods.length, d = r.goods.filter(g => g.done).length;
    total += t; done += d;
    if (t > 0 && d === t) shopsDone++;
  });
  const p = day?.purchase || [];
  const amount = p.reduce((s, x) => s + (x.qty || 0) * (x.price || 0), 0);
  return {
    shops: day?.restaurants.length || 0, shopsDone, total, done,
    pCount: p.length, pDone: p.filter(x => x.done).length, amount
  };
}
const rDone = r => r.goods.length > 0 && r.goods.every(g => g.done);

/* ---------- 常用门店 ---------- */
function normName(s){
  let n = String(s || '').toLowerCase().replace(/[\s·•\-—_()（）【】\[\]]/g, '');
  const suffix = /(老火锅|火锅店|火锅|餐饮店|餐饮|分店|店)$/;
  while (suffix.test(n)) n = n.replace(suffix, '');
  return n;
}
function findLibraryStore(name){
  const n = normName(name);
  if (!n) return null;
  let best = null, bestScore = 0;
  (db.stores || []).forEach(s => {
    const sn = normName(s.name);
    if (!sn) return;
    let score = 0;
    if (sn === n) score = 100;
    else if (sn.includes(n) || n.includes(sn)) {
      const diff = Math.abs(sn.length - n.length);
      if (diff <= 4) score = 60 - diff;
    }
    if (score > bestScore) { bestScore = score; best = s; }
  });
  return bestScore >= 55 ? best : null;
}
function canonicalName(name){
  const hit = findLibraryStore(name);
  return hit ? hit.name : String(name || '').trim();
}
function addToLibrary(name){
  const clean = String(name || '').trim();
  if (!clean) return;
  const exists = (db.stores || []).some(s => normName(s.name) === normName(clean));
  if (!exists) db.stores.push({ id: uid(), name: clean, createdAt: todayKey() });
}
function lastGoodsOf(name){
  const n = normName(name);
  const keys = Object.keys(db.days).sort((a, b) => b.localeCompare(a));
  for (const k of keys) {
    const r = (db.days[k].restaurants || []).find(x => normName(x.name) === n);
    if (r && r.goods.length) {
      return { date: k, goods: r.goods.map(g => ({ name: g.name, qty: g.qty, unit: g.unit, remark: g.remark || '' })) };
    }
  }
  return null;
}
function storeInToday(name){
  const n = normName(name);
  return (getDay(currentDate, false)?.restaurants || []).some(r => normName(r.name) === n);
}
function addStoreToToday(name){
  const day = getDay(currentDate);
  if (storeInToday(name)) return false;
  const last = lastGoodsOf(name);
  day.restaurants.push({
    id: uid(), name, deliveredAt: null,
    goods: (last ? last.goods : []).map(g => ({ id: uid(), ...g, done: false }))
  });
  save();
  return true;
}

/* 由配送清单汇总采购条目，尽量沿用已填单价 */
function aggregateOf(day){
  const map = new Map();
  (day.restaurants || []).forEach(r => r.goods.forEach(g => {
    const key = g.name + '|' + g.unit;
    const cur = map.get(key);
    if (cur) cur.qty += g.qty;
    else map.set(key, { name: g.name, unit: g.unit, qty: g.qty });
  }));
  const oldPrice = new Map((day.purchase || []).map(p => [p.name + '|' + p.unit, p.price]));
  return [...map.values()].map(x => ({
    id: uid(), name: x.name, unit: x.unit, qty: x.qty, remark: '',
    price: oldPrice.has(x.name + '|' + x.unit) ? oldPrice.get(x.name + '|' + x.unit) : (PRICE[x.name] || 0),
    done: false
  }));
}

/* =========================================================
   粘贴文字解析
   ========================================================= */
function parseItemText(seg){
  let s = seg.replace(/^[\s\-–—•·*#]+/, '').replace(/^[0-9]+[.、)）]\s*/, '').replace(/[。.\s]+$/, '').trim();
  if (!s) return null;
  const m = s.match(/^(.+?)\s*(?:[xX×*]\s*)?(\d+(?:\.\d+)?)\s*([^\s\d]{0,2})\s*$/);
  let name = s, qty = 1, unit = '份';
  if (m) {
    name = m[1].trim();
    qty = parseFloat(m[2]) || 1;
    const u = (m[3] || '').trim();
    if (u) {
      if (UNIT_SET.has(u)) unit = u;
      else name = (name + ' ' + u).trim();
    }
  }
  name = name.replace(/^[、,，;；:：]+|[、,，;；:：]+$/g, '').trim();
  if (!name) return null;
  return { name, qty, unit };
}

function parseDeliveryText(text, fallbackName){
  const norm = String(text || '')
    .replace(/([0-9]+(?:\.[0-9]+)?)([份斤箱袋个包瓶盒件只条桶把根块片罐])(?=[\u4e00-\u9fa5])/g, '$1$2、');
  const groups = [];
  let current = null;
  norm.split(/[\n；;]+/).map(s => s.trim()).filter(Boolean).forEach(line => {
    let store = null, body = line;
    const ci = line.search(/[：:]/);
    if (ci > 0) { store = line.slice(0, ci).trim(); body = line.slice(ci + 1).trim(); }
    if (store) {
      current = { name: store, goods: [] };
      groups.push(current);
    } else if (!current) {
      current = { name: (fallbackName || '').trim() || '今日配送', goods: [] };
      groups.push(current);
    }
    body.split(/[、,，]/).forEach(seg => {
      const item = parseItemText(seg);
      if (item) current.goods.push(item);
    });
  });
  return groups.filter(g => g.goods.length);
}

/* =========================================================
   渲染
   ========================================================= */
const $ = id => document.getElementById(id);
const scrollEl = $('scroll');
const topbarEl = $('topbar');
const ic = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4.5 4.5L19 7"/></svg>',
  cal: '<svg class="cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8.5 12 3 3 8.5v7L12 21l9-5.5Z"/><path d="M3 8.5 12 14l9-5.5M12 14v7"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h2l2.2 10.5h9.4L20 7.5H6"/><circle cx="9.5" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>',
  store: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5V20h16V9.5"/><path d="M3 9.5 5.5 4h13L21 9.5"/><path d="M3 9.5h18"/><path d="M9.5 20v-5.5h5V20"/></svg>'
};

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function renderTopbar(){
  if (route.name === 'detail') {
    const r = findRestaurant(route.rid);
    topbarEl.className = 'detail-top';
    topbarEl.innerHTML = `
      <button class="back" id="btnBack">${ic.back}</button>
      <div style="flex:1;min-width:0">
        <div class="detail-title">${esc(r ? r.name : '')}</div>
        <div class="detail-sub">${fmtLong(currentDate)}${dayLabel(currentDate) ? ' · ' + dayLabel(currentDate) : ''}</div>
      </div>`;
    $('btnBack').onclick = () => { route = { name: 'home' }; render(); };
    return;
  }
  const { m, d } = parseKey(currentDate);
  const tag = dayLabel(currentDate);
  const isHistory = route.name === 'history';
  const sub = isHistory ? '历史记录' : route.name === 'purchase' ? '采购清单' : route.name === 'stores' ? '常用门店' : '每日送货单';
  topbarEl.className = 'topbar';
  topbarEl.innerHTML = `
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 10h16l-1.6 9.2a2 2 0 0 1-2 1.8H7.6a2 2 0 0 1-2-1.8Z"/><path d="M8.5 6.5c1.4 0 1.4-2 0-2M12 6c1.5 0 1.5-2.4 0-2.4M15.5 6.5c1.4 0 1.4-2 0-2"/>
        </svg>
      </div>
      <div class="brand-title">火锅配送</div>
      <div class="brand-sub">${sub}</div>
    </div>
    ${isHistory ? '' : `
    <div class="daterow">
      <div class="date-btn">
        ${ic.cal}
        <div class="date-main">${m}月${d}日</div>
        ${tag ? `<span class="date-tag">${tag}</span>` : ''}
        <span class="date-week">${parseKey(currentDate).week}</span>
        <input type="date" id="dateInput" value="${currentDate}" />
      </div>
      <button class="today-btn" id="btnToday">今天</button>
    </div>`}`;
  if (isHistory) return;
  $('dateInput').addEventListener('change', e => {
    const v = e.target.value;
    if (v) { currentDate = v; render(); }
  });
  $('btnToday').onclick = () => { currentDate = todayKey(); render(); };
}

function findRestaurant(rid){
  const day = getDay(currentDate, false);
  return (day?.restaurants || []).find(r => r.id === rid);
}

/* ---------- 首页 ---------- */
function renderHome(){
  const day = getDay(currentDate, false);
  const list = day?.restaurants || [];
  const { shops, shopsDone, total, done } = dayStats(day);
  const pct = total ? Math.round(done / total * 100) : 0;
  const isToday = currentDate === todayKey();

  let html = `
    <div class="overview">
      <div class="ov-head">
        <div class="ov-num">${done}<small>/${total}</small></div>
        <div class="ov-label">项已送达</div>
        <div class="ov-right">${shops} 家火锅店<br>${shopsDone} 家已送完</div>
      </div>
      <div class="ov-bar"><i style="width:${pct}%"></i></div>
      <div class="ov-foot">
        <span><b>${pct}%</b>完成率</span>
        <span><b>${total - done}</b>项待送</span>
      </div>
    </div>
    <div class="sec-head">
      <div class="sec-title">${isToday ? '今日配送门店' : '当日配送门店'}</div>
      <div class="sec-count">${shops} 家</div>
      <div class="sec-line"></div>
      <button class="mini-btn" id="btnPaste">粘贴识别</button>
    </div>`;

  if (!list.length) {
    html += `<div class="empty">${ic.box}<p>这一天还没有门店</p><span>粘一张送货单，或手动添加火锅店</span>
      <div class="empty-actions"><button id="ePaste">粘贴识别</button><button id="eAdd">手动添加</button></div></div>`;
  } else {
    list.forEach((r, i) => {
      const t = r.goods.length, d = r.goods.filter(g => g.done).length;
      const isDone = rDone(r);
      const chip = isDone
        ? `<span class="chip done">${ic.done}已送完</span>`
        : d > 0 ? `<span class="chip doing">${d}/${t} 已送</span>`
                : `<span class="chip none">未开始</span>`;
      const pending = r.goods.filter(g => !g.done);
      const todo = pending.length
        ? `<div class="todo-line">${pending.slice(0, 3).map(g => `<span>${esc(g.name)} ${num(g.qty)}${esc(g.unit)}</span>`).join('')}${pending.length > 3 ? `<span class="more">+${pending.length - 3}</span>` : ''}</div>`
        : '';
      html += `
        <div class="card${isDone ? ' done' : ''}" data-rid="${r.id}" style="animation-delay:${Math.min(i * 40, 240)}ms">
          <div class="card-row">
            <div class="avatar">${esc(r.name.slice(0, 1))}</div>
            <div style="flex:1;min-width:0">
              <div class="card-name">${esc(r.name)}</div>

/* ---------- 采购清单 ---------- */
function renderPurchase(){
  const day = getDay(currentDate, false);
  const list = day?.purchase || [];
  const total = list.reduce((s, x) => s + x.qty * x.price, 0);
  const doneAmount = list.filter(x => x.done).reduce((s, x) => s + x.qty * x.price, 0);
  const doneCount = list.filter(x => x.done).length;
  const noPrice = list.filter(x => !x.price).length;

  let html = `
    <div class="sum-card">
      <div class="sum-top">
        <div class="sum-money"><small>¥</small>${(Math.round(total * 100) / 100).toFixed(2)}</div>
        <div class="sum-cap">采购合计</div>
        <div class="sum-right">已采购 <b>${doneCount}</b>/${list.length} 项<br>已花 <b>${money(doneAmount)}</b></div>
      </div>
      <div class="sum-foot">
        <div class="pbar"><i style="width:${list.length ? doneCount / list.length * 100 : 0}%"></i></div>
        <span>${noPrice ? `${noPrice} 项待填单价` : '单价齐全'}</span>
      </div>
    </div>
    <div class="sec-head">
      <div class="sec-title">采购明细</div>
      <div class="sec-count">${list.length} 项</div>
      <div class="sec-line"></div>
      <button class="mini-btn" id="pAgg">按配送汇总</button>
      <button class="mini-btn solid" id="pAdd">+</button>
    </div>`;

  if (!list.length) {
    html += `<div class="empty">${ic.cart}<p>还没有采购条目</p><span>按当天配送清单汇总，或手动添加菜品与价格</span>
      <div class="empty-actions"><button id="eAgg">按配送汇总</button><button id="ePAdd">手动添加</button></div></div>`;
  } else {
    html += `<div class="p-list">`;
    list.forEach((p, i) => {
      html += `
        <div class="p-row${p.done ? ' done' : ''}" data-pid="${p.id}" style="animation-delay:${Math.min(i * 25, 240)}ms">
          <div class="g-check">${ic.check}</div>
          <div class="p-main">
            <div class="p-name">${esc(p.name)}</div>
            <div class="p-meta">${num(p.qty)} ${esc(p.unit)} · ${p.remark ? esc(p.remark) + ' · ' : ''}${p.price ? money(p.price) + '/' + esc(p.unit) : '未填单价'}</div>
          </div>
          <div class="p-amt"><b>${p.price ? money(p.qty * p.price) : '--'}</b>${p.price ? '' : '<span>待定价</span>'}</div>
          <button class="g-edit" data-pedit="${p.id}" aria-label="编辑">${ic.edit}</button>
        </div>`;
    });
    html += `</div>
      <button class="clear-btn" id="btnCsv">导出采购单 CSV</button>`;
  }
  scrollEl.innerHTML = html;

  const add = () => openPurchaseSheet(null);
  const agg = () => aggregatePurchase();
  ['pAdd', 'ePAdd'].forEach(id => { const el = $(id); if (el) el.onclick = add; });
  ['pAgg', 'eAgg'].forEach(id => { const el = $(id); if (el) el.onclick = agg; });
  const csv = $('btnCsv'); if (csv) csv.onclick = exportPurchaseCsv;

  scrollEl.querySelectorAll('.p-row').forEach(row => {
    row.onclick = e => {
      if (e.target.closest('.g-edit')) return;
      const p = list.find(x => x.id === row.dataset.pid);
      p.done = !p.done;
      save(); toast(p.done ? `已采购：${p.name}` : `已撤销：${p.name}`);
      render();
    };
  });
  scrollEl.querySelectorAll('[data-pedit]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); openPurchaseSheet(btn.dataset.pedit); };
  });
}

function aggregatePurchase(){
  const day = getDay(currentDate);
  const hasData = (day.purchase || []).length > 0;
  if (hasData && !confirm('将按当天配送清单重新汇总采购条目（已填单价会尽量保留），继续吗？')) return;
  const next = aggregateOf(day);
  if (!next.length) return toast('当天还没有配送菜品');
  day.purchase = next;
  save(); render(); toast(`已汇总 ${next.length} 项采购`);
}

/* 添加门店 */
function openAddRestaurant(){
  sheetEl.innerHTML = `
    <div class="grab"></div>

    <div class="field">
      <label>门店名称</label>
      <input class="input" id="mName" list="mStoreList" placeholder="如：川味老火锅" maxlength="20" autocomplete="off" />
      <datalist id="mStoreList">${(db.stores || []).map(s => `<option value="${esc(s.name)}"></option>`).join('')}</datalist>
    </div>
    <div class="field">
      <label>要送的菜品（可多选，之后可改数量与规格）</label>
      <div class="chips" id="mChips">
        ${PRESET_GOODS.map(n => `<button class="pick" data-n="${n}">${n}</button>`).join('')}
      </div>
    </div>
    <label class="check-line"><input type="checkbox" id="mSaveStore" checked /> 存入常用门店，以后可直接选</label>
    <div class="hint">想一次性录入多家门店？用首页「粘贴识别」更快。</div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="mOk">添加门店</button>
    </div>`;
  const picked = new Set();
  sheetEl.querySelectorAll('.pick').forEach(b => {
    b.onclick = () => {
      const n = b.dataset.n;
      picked.has(n) ? picked.delete(n) : picked.add(n);
      b.classList.toggle('on', picked.has(n));
    };
  });
  $('mOk').onclick = () => {
    const raw = $('mName').value.trim();
    if (!raw) return toast('请填写门店名称');
    const name = canonicalName(raw);
    const day = getDay(currentDate);
    if (day.restaurants.some(r => normName(r.name) === normName(name))) return toast('这家门店今天已存在');
    day.restaurants.push({
      id: uid(), name, deliveredAt: null,
      goods: [...picked].map(n => ({ id: uid(), name: n, qty: 1, unit: '份', remark: '', done: false }))
    });
    if ($('mSaveStore').checked) addToLibrary(name);
    save(); closeSheet(); render(); toast(`已添加「${name}」`);
  };
  openSheet();
}

/* 粘贴识别 */
function openPasteSheet(){
  sheetEl.innerHTML = `
    <div class="grab"></div>
    <h3>粘贴文字生成配送清单</h3>
    <div class="field">
      <label>送货单文字 <button class="link-btn" id="mSample" style="float:right">填入示例</button></label>
      <textarea class="input" id="mText" rows="5" placeholder="川味老火锅：毛肚5斤、鸭肠3份、黄喉2斤&#10;牛油记：牛肉卷6份，虾滑2份，宽粉2袋"></textarea>
    </div>
    <div class="field">
      <label>没有门店名时，归入</label>
      <input class="input" id="mFallback" placeholder="今日配送" maxlength="20" />
    </div>
    <label class="check-line"><input type="checkbox" id="mLearn" checked /> 自动存入常用门店（下次粘贴自动识别）</label>
    <div class="field">
      <label>识别结果</label>
      <div class="preview" id="mPreview"><span class="pv-empty">粘贴后自动识别门店与菜品</span></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="mParse" disabled>生成配送清单</button>
    </div>
    <div class="hint" style="margin-top:9px">支持「门店A：毛肚5斤、鸭肠3份」每行一家；数量可写 5斤 / 5 斤 / x5，不写单位默认按份。</div>`;

  const textEl = $('mText'), fbEl = $('mFallback'), pvEl = $('mPreview'), okEl = $('mParse');
  let groups = [];

  const refresh = () => {
    groups = parseDeliveryText(textEl.value, fbEl.value).map(g => {
      const hit = findLibraryStore(g.name);
      return { ...g, matched: !!hit, name: hit ? hit.name : g.name };
    });
    if (!groups.length) {
      pvEl.innerHTML = '<span class="pv-empty">粘贴后自动识别门店与菜品</span>';
      okEl.disabled = true;
      return;
    }
    const items = groups.reduce((s, g) => s + g.goods.length, 0);
    const matched = groups.filter(g => g.matched).length;
    pvEl.innerHTML = `<b>识别到 ${groups.length} 家门店 · ${items} 项货品</b>${matched ? ` <span class="pv-tag">${matched} 家匹配常用门店</span>` : ''}` +
      groups.map(g => `<div class="pv-store"><b>${esc(g.name)}</b>${g.matched ? '<span class="pv-tag">常用</span>' : ''}${g.goods.length} 项
        <div class="pv-items">${g.goods.map(x => `${esc(x.name)} ${num(x.qty)}${esc(x.unit)}`).join('、')}</div></div>`).join('');
    okEl.disabled = false;
  };
  textEl.addEventListener('input', refresh);
  fbEl.addEventListener('input', refresh);

  $('mSample').onclick = () => {
    textEl.value = '川味老火锅：毛肚5斤、鸭肠3份、黄喉2斤\n牛油记：牛肉卷6份，虾滑2份，宽粉2袋\n蜀九香：羊肉卷5份、午餐肉2箱、藕片3份、鸭血2份';
    refresh();
  };

  okEl.onclick = () => {
    if (!groups.length) return;
    const day = getDay(currentDate);
    let newShops = 0, mergeShops = 0, newGoods = 0;
    groups.forEach(g => {
      let r = day.restaurants.find(x => normName(x.name) === normName(g.name));
      if (!r) {
        r = { id: uid(), name: g.name, deliveredAt: null, goods: [] };
        day.restaurants.push(r); newShops++;
      } else mergeShops++;
      g.goods.forEach(it => {
        const same = r.goods.find(x => x.name === it.name && x.unit === it.unit);
        if (same) same.qty += it.qty;
        else { r.goods.push({ id: uid(), name: it.name, qty: it.qty, unit: it.unit, remark: '', done: false }); }
        newGoods++;
      });
      syncDeliveredAt(r);
    });
    if ($('mLearn').checked) groups.forEach(g => addToLibrary(g.name));
    save(); closeSheet(); render();
    toast(newShops && !mergeShops ? `已生成 ${newShops} 家门店 · ${newGoods} 项货品`
      : `已合并 ${newShops + mergeShops} 家门店 · ${newGoods} 项货品`);
  };

  openSheet();
  setTimeout(() => textEl.focus(), 320);
}

    if (!name) return toast('请填写菜品名称');
    if (editing) {
      editing.name = name; editing.remark = remark; editing.qty = qty; editing.unit = unit;
    } else {
      r.goods.push({ id: uid(), name, remark, qty, unit, done: false });
    }
    syncDeliveredAt(r); save(); closeSheet(); render();
    toast(editing ? '已保存' : `已添加「${name}」`);
  };
  const del = $('mDel');
  if (del) del.onclick = () => {
    r.goods = r.goods.filter(g => g.id !== editing.id);
    syncDeliveredAt(r); save(); closeSheet(); render(); toast('已删除');
  };
  openSheet();
}

/* 采购条目 */
function openPurchaseSheet(pid){
  const day = getDay(currentDate);
  const editing = pid ? day.purchase.find(p => p.id === pid) : null;
  sheetEl.innerHTML = `
    <div class="grab"></div>
    <h3>${editing ? '编辑采购条目' : '添加采购条目'}</h3>
    <div class="field">
      <label>菜品名称</label>
      <input class="input" id="pName" placeholder="如：毛肚" maxlength="16" value="${editing ? esc(editing.name) : ''}" />
    </div>
    <div class="row-2">
      <div class="field">
        <label>数量</label>
        <input class="input" id="pQty" type="number" min="0.5" step="0.5" inputmode="decimal" value="${editing ? editing.qty : 1}" />
      </div>
      <div class="field">
        <label>单位</label>
        <select class="input" id="pUnit">
          ${UNITS.map(u => `<option ${editing && editing.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="field">
        <label>单价（元 / 单位）</label>
        <input class="input" id="pPrice" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0.00" value="${editing && editing.price ? editing.price : ''}" />
      </div>
      <div class="field">
        <label>小计</label>
        <input class="input" id="pSum" value="¥0.00" readonly style="background:#F6F2EE;color:var(--ink-2)" />
      </div>
    </div>
    <div class="field">
      <label>规格 / 备注</label>
      <input class="input" id="pRemark" placeholder="如：冰鲜、整箱打包" maxlength="24" value="${editing ? esc(editing.remark) : ''}" />
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="pOk">${editing ? '保存' : '添加'}</button>
    </div>
    ${editing ? `<div class="sheet-actions" style="margin-top:10px"><button class="btn danger" id="pDel">删除这条采购</button></div>` : ''}`;

  const calc = () => {
    const q = parseFloat($('pQty').value) || 0;
    const pr = parseFloat($('pPrice').value) || 0;
    $('pSum').value = money(q * pr);
  };
  $('pQty').addEventListener('input', calc);
  $('pPrice').addEventListener('input', calc);
  calc();

  $('pOk').onclick = () => {
    const name = $('pName').value.trim();
    if (!name) return toast('请填写菜品名称');
    const item = {
      name,
      qty: parseFloat($('pQty').value) || 1,
      unit: $('pUnit').value,
      price: parseFloat($('pPrice').value) || 0,
      remark: $('pRemark').value.trim()
    };
    if (editing) Object.assign(editing, item);
    else day.purchase.push({ id: uid(), done: false, ...item });
    save(); closeSheet(); render();
    toast(editing ? '已保存' : `已添加「${name}」`);
  };
  const del = $('pDel');
  if (del) del.onclick = () => {
    day.purchase = day.purchase.filter(p => p.id !== editing.id);
    save(); closeSheet(); render(); toast('已删除');
  };
  openSheet();
}

/* 常用门店编辑 */
function openStoreSheet(sid){
  const store = sid ? (db.stores || []).find(s => s.id === sid) : null;
  const last = store ? lastGoodsOf(store.name) : null;
  const inToday = store ? storeInToday(store.name) : false;
  sheetEl.innerHTML = `
    <div class="grab"></div>
    <h3>${store ? '门店设置' : '添加常用门店'}</h3>
    <div class="field">
      <label>门店名称</label>
      <input class="input" id="stName" value="${store ? esc(store.name) : ''}" placeholder="如：川味老火锅（只填名字即可）" maxlength="20" />
    </div>
    <div class="hint" style="margin-top:-4px">${last
      ? `最近 ${Number(last.date.slice(5, 7))}月${Number(last.date.slice(8, 10))}日 送过 ${last.goods.length} 项货品，可一键带入今天。`
      : '只保存门店名字；之后粘贴送货单会自动匹配到这家店。'}</div>
    <div class="sheet-actions">
      <button class="btn btn-primary" id="stSave">${store ? '保存' : '添加门店'}</button>
    </div>
    ${store ? `<div class="sheet-actions" style="margin-top:10px">
        <button class="btn btn-ghost" id="stToday" style="flex:1;${inToday ? 'opacity:.5' : ''}" ${inToday ? 'disabled' : ''}>${inToday ? '今天已在列' : '加入今天的配送'}</button>
        <button class="btn danger" id="stDel" style="width:86px;flex:0 0 86px">删除</button>
      </div>` : ''}`;

  $('stSave').onclick = () => {
    const name = $('stName').value.trim();
    if (!name) return toast('请填写门店名称');
    const dup = (db.stores || []).some(s => normName(s.name) === normName(name) && (!store || s.id !== store.id));
    if (dup) return toast('这家门店已在常用门店里');
    if (store) store.name = name;
    else db.stores.push({ id: uid(), name, createdAt: todayKey() });
    save(); closeSheet();
    if (route.name === 'stores') render(); else toast('已保存');
  };

  if (store) {
    const t = $('stToday');
    if (t) t.onclick = () => {
      if (addStoreToToday(store.name)) {
        const l = lastGoodsOf(store.name);
        closeSheet(); render();
        toast(l ? `已加入今天 · 带入 ${l.goods.length} 项常用货品` : '已加入今天');
      } else toast('今天已有这家门店');
    };
    $('stDel').onclick = () => {
      if (!confirm(`确定从常用门店里删除「${store.name}」吗？历史记录不受影响。`)) return;
      db.stores = (db.stores || []).filter(s => s.id !== store.id);
      save(); closeSheet(); render(); toast('已删除');
    };
  }
  openSheet();
}

/* =========================================================
   备份 / 导出
   ========================================================= */
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function exportBackup(){
  download(`火锅配送备份-${todayKey()}.json`, JSON.stringify(db, null, 2), 'application/json');
  toast('备份已导出');
}
$('importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || !data.days) throw new Error('bad');
      db = normalize(data); save(); currentDate = todayKey(); route = { name: 'home' }; render();
      toast('备份已导入');
    } catch (err) { toast('文件格式不正确'); }
  };
  reader.readAsText(f);
  e.target.value = '';
});

function csvOf(list){
  const rows = [['菜品', '规格/备注', '数量', '单位', '单价', '小计', '已采购']];
  list.forEach(p => {
    rows.push([p.name, p.remark || '', num(p.qty), p.unit, p.price || 0,
      (Math.round(p.qty * (p.price || 0) * 100) / 100).toFixed(2), p.done ? '是' : '否']);
  });
  const sum = list.reduce((s, x) => s + x.qty * (x.price || 0), 0);
  rows.push(['合计', '', '', '', '', (Math.round(sum * 100) / 100).toFixed(2), '']);
  const body = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  return '\ufeff' + body;
}
function exportPurchaseCsv(){
  const day = getDay(currentDate, false);
  if (!day?.purchase?.length) return toast('当天没有采购条目');
  download(`采购单-${currentDate}.csv`, csvOf(day.purchase), 'text/csv;charset=utf-8');
  toast('采购单已导出');
}
function exportAllCsv(){
  const keys = Object.keys(db.days).sort();
  if (!keys.length) return toast('还没有任何记录');
  const blocks = [];
  keys.forEach(k => {
    blocks.push(`日期,${k}${dayLabel(k) ? '（' + dayLabel(k) + '）' : ''}`);
    blocks.push(csvOf(db.days[k].purchase || []).replace(/^\ufeff/, ''));
    blocks.push('');
  });
  download(`采购汇总-${todayKey()}.csv`, '\ufeff' + blocks.join('\r\n'), 'text/csv;charset=utf-8');
  toast('采购汇总已导出');
}

/* toast */
let toastTimer;
function toast(msg){
  const el = $('toast');
  if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* =========================================================
   路由
   ========================================================= */
let lastRouteKey = '';
function render(){
  const key = route.name + (route.rid || '') + currentDate;
  const samePage = key === lastRouteKey;
  const prevTop = scrollEl.scrollTop;
  lastRouteKey = key;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('on', t.dataset.tab === route.name ||
      (route.name === 'detail' && t.dataset.tab === 'home'));
  });
  $('tabbar').style.display = route.name === 'detail' ? 'none' : 'flex';
  $('fab').style.display = route.name === 'home' ? 'grid' : 'none';
  renderTopbar();
  if (samePage) scrollEl.scrollTop = prevTop; else scrollEl.scrollTop = 0;

  if (route.name === 'home') renderHome();
  else if (route.name === 'detail') renderDetail();
  else if (route.name === 'purchase') renderPurchase();
  else if (route.name === 'stores') renderStores();
  else renderHistory();

  if (route.name === 'detail') {
    const r = findRestaurant(route.rid);
    let foot = document.getElementById('detailFoot');
    if (!foot) {
      foot = document.createElement('div');
      foot.id = 'detailFoot'; foot.className = 'detail-foot';
      document.querySelector('.app').appendChild(foot);
    }
    const allDone = rDone(r);
    foot.innerHTML = `
      <button class="btn btn-ghost" id="addGood">加菜品</button>
      <button class="btn btn-primary" id="allDone" ${allDone || !r.goods.length ? 'disabled' : ''}>
        ${allDone ? '本店已全部送达' : '一键全部送达'}
      </button>`;
    foot.style.display = 'flex';
    $('addGood').onclick = () => openGoodSheet(r, null);
    if (!allDone && r.goods.length) {
      $('allDone').onclick = () => {
        r.goods.forEach(g => g.done = true);
        syncDeliveredAt(r); save(); render();
        toast(`「${r.name}」菜品已全部送完`);
      };
    }
    scrollEl.style.paddingBottom = '96px';
  } else {
    const foot = document.getElementById('detailFoot');
    if (foot) foot.style.display = 'none';
    scrollEl.style.paddingBottom = '108px';
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => { route = { name: t.dataset.tab }; render(); };
});
$('fab').onclick = () => { openAddRestaurant(); };

/* 初始化 */
getDay(todayKey());
render();

/* 离线缓存：装到桌面后断网也能用 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
/* 申请持久存储，降低被系统清理的概率 */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted()
    .then(p => { if (!p) return navigator.storage.persist(); })
    .catch(() => {});
}
